name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly, so a newly published detector finds old code rather than waiting
    # for someone to touch the file again.
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin

      - name: Build
        run: mvn -B -DskipTests package

      - uses: github/codeql-action/analyze@v3
