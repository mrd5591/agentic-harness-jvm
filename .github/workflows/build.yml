name: build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      # Every gate runs here, in one invocation. There is no "warn only" mode:
      # any gate that fails fails this job. PIT is bound to verify after
      # SpotBugs, so the mutation profile runs every other gate on the way and
      # nothing needs a second pass.
      #
      # What a workflow file cannot do is make green mean mergeable. That takes
      # a branch protection rule or a ruleset marking this check required, and
      # that is a repository setting, not something this file can assert about
      # itself. Until one exists, a red build can still be pushed to main.
      - name: Verify (coverage ratchet, checkstyle, spotbugs, architecture rules, mutation)
        run: mvn -B -Pmutation verify

      - name: Publish reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-reports
          path: |
            **/target/site/jacoco/
            **/target/pit-reports/
          retention-days: 14
